<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>P2P VoIP (Cross-Platform)</title>
</head>
<body>
  <h2>P2P Voice Call (Any Device)</h2>

  <button onclick="init()">Init</button>
  <button onclick="makeOffer()">Make Offer</button>
  <button onclick="makeAnswer()">Make Answer</button>

  <h3>Local SDP</h3>
  <textarea id="local" rows="10" cols="80"></textarea>

  <h3>Remote SDP</h3>
  <textarea id="remote" rows="10" cols="80"></textarea>

  <script>
    let pc;

    async function init() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => pc.addTrack(t, stream));

      pc.onicecandidate = e => {
        if (!e.candidate) {
          document.getElementById("local").value =
            JSON.stringify(pc.localDescription);
        }
      };

      pc.ontrack = e => {
        const audio = document.createElement("audio");
        audio.srcObject = e.streams[0];
        audio.autoplay = true;
        document.body.appendChild(audio);
      };
    }

    async function makeOffer() {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
    }

    async function makeAnswer() {
      const remote = JSON.parse(
        document.getElementById("remote").value
      );
      await pc.setRemoteDescription(remote);

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
    }
  </script>
</body>
</html>
