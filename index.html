<!DOCTYPE html>
<html>
<head>
  <title>GitHub Pages VoIP Peer</title>
</head>
<body>
  <h1>GitHub Pages Peer</h1>
  <button id="startBtn">Start Call</button>
  <audio id="localAudio" autoplay muted></audio>
  <audio id="remoteAudio" autoplay></audio>

  <script>
    let pc;
    let localStream;
    const localAudio = document.getElementById('localAudio');
    const remoteAudio = document.getElementById('remoteAudio');
    const startBtn = document.getElementById('startBtn');

    // Same WebSocket URL as Ubuntu side
    const ws = new WebSocket('wss://ceilinged-unmodern-georgiana.ngrok-free.dev ');

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);
      if (msg.offer) {
        await pc.setRemoteDescription(msg.offer);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ answer }));
      } else if (msg.answer) {
        await pc.setRemoteDescription(msg.answer);
      } else if (msg.candidate) {
        pc.addIceCandidate(msg.candidate);
      }
    };

    startBtn.onclick = async () => {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localAudio.srcObject = localStream;

      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      pc.onicecandidate = (event) => {
        if (event.candidate) ws.send(JSON.stringify({ candidate: event.candidate }));
      };

      pc.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0];
      };

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      ws.send(JSON.stringify({ offer }));
    };
  </script>
</body>
</html>
